      const cleaned = String(text || "").replace(/,/g, ".").replace(/\s/g, "").trim();
      if (!cleaned) return NaN;
      const direct = parseFloat(cleaned);
      if (!Number.isNaN(direct)) return direct;
      const match = String(text || "").match(/-?\d+(?:[.,]\d+)?/);
      return match ? parseFloat(match[0].replace(",", ".")) : NaN;
    }

    function formatToolResult(value) {
      if (Math.abs(value - Math.round(value)) < 0.0000001) return String(Math.round(value));
      return String(value);
    }

    async function copyText(text, options = {}) {
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        if (!options.silent) toast("已复制");
        return true;
      } catch {
        if (!options.silent) toast("复制失败");
        return false;
      }
    }

    async function enableToolWatch(tool) {
      if (!navigator.clipboard?.readText || !navigator.clipboard?.writeText) {
        toast("浏览器不允许监听剪贴板");
        syncToolWatch(null);
        return;
      }
      try {
        lastToolSeenClipboard = await navigator.clipboard.readText();
      } catch {
        toast("请允许读取剪贴板");
        syncToolWatch(null);
        return;
      }
      syncToolWatch(tool);
      pollToolClipboard();
      clearInterval(toolWatchTimer);
      toolWatchTimer = setInterval(pollToolClipboard, 700);
      toast(tool === "add30" ? "划线价监听中" : "换美金监听中");
    }

    function disableToolWatch() {
      clearInterval(toolWatchTimer);
      syncToolWatch(null);
      lastToolSeenClipboard = "";
      lastToolCopied = "";
      toast("已停止监听");
    }

    function syncToolWatch(tool) {
      state.toolWatch = tool;
      els.watchAdd30.checked = tool === "add30";
      els.watchUsd.checked = tool === "usd";
    }

    async function pollToolClipboard() {
      if (!state.toolWatch) return;
      let text = "";
      try {
        text = await navigator.clipboard.readText();
      } catch {
        disableToolWatch();
        toast("剪贴板监听已关闭");
        return;
      }
      const value = String(text || "").trim();
      if (!value || value === lastToolSeenClipboard || value === lastToolCopied) return;
      const number = extractToolNumber(value);
      if (Number.isNaN(number)) {
        lastToolSeenClipboard = value;
        return;
      }
      lastToolSeenClipboard = value;

      if (state.toolWatch === "add30") {
        els.add30Input.value = formatToolResult(number);
        updateAdd30();
        await copyToolResult(els.add30Output.value, "划线价已复制");
      }

      if (state.toolWatch === "usd") {
        els.usdInput.value = formatToolResult(number);
        updateUsd();
        await copyToolResult(els.usdIntOutput.value, "换美金整数已复制");
      }
    }

    async function copyToolResult(text, message) {
      if (!text) return;
      const copied = await copyText(text, { silent: true });
      if (copied) {
        lastToolCopied = text;
        lastToolSeenClipboard = text;
        toast(message);
      } else {
        toast("自动复制失败");
      }
    }

    function renderClips() {
      clearExpiredClips();
      const clips = todayClips();
      els.clipList.innerHTML = clips.map(clip => `
        <article class="clip-item">
          <p class="clip-text">${escapeHTML(clip.text)}</p>
          <div class="clip-actions">
            <button class="mini-button" type="button" data-clip-action="copy" data-clip-id="${escapeHTML(clip.id)}" title="复制" aria-label="复制">${icons.copy}</button>
            <button class="mini-button danger" type="button" data-clip-action="delete" data-clip-id="${escapeHTML(clip.id)}" title="删除" aria-label="删除">${icons.trash}</button>
          </div>
        </article>
      `).join("");
    }

    function renderFloat() {
      els.floatingPanel.hidden = !state.floatingOpen || els.noteApp.hidden;
      els.floatingTitle.textContent = state.viewDate === todayISO() ? "今天" : formatDate.format(parseISO(state.viewDate));
      if (els.floatingPanel.hidden) return;
      const tasks = state.tasks
        .filter(task => task.date === state.viewDate && task.status !== "canceled")
        .sort((a, b) => statusOrder(a.status) - statusOrder(b.status) || b.createdAt.localeCompare(a.createdAt));
      els.floatingList.innerHTML = tasks.length ? tasks.map(renderMiniTask).join("") : '<div class="empty">这一天很清爽</div>';
    }

    function renderMiniTask(task) {
      const status = normalizeStatus(task.status);
      return `
        <article class="mini-task ${escapeHTML(status)}" data-task-id="${escapeHTML(task.id)}">
          <button class="check" type="button" data-action="toggle" title="完成" aria-label="完成">${icons.check}</button>
          <p class="task-title">${escapeHTML(task.title)}</p>
          <div class="actions">
            <button class="mini-button" type="button" data-action="delay" title="延期" aria-label="延期">${icons.delay}</button>
            <button class="mini-button danger" type="button" data-action="delete" title="删除" aria-label="删除">${icons.trash}</button>
          </div>
        </article>
      `;
    }

    async function pasteFromClipboard() {
      try {
        if (!navigator.clipboard?.readText) throw new Error("No clipboard API");
        const text = await navigator.clipboard.readText();
        addClip(text);
      } catch {
        toast("直接粘贴到框里");
      }
    }

    function addClip(text) {
      const value = text.trim();
      if (!value) return;
      if (new Date() >= clipExpiry(todayISO())) {
        toast("20点后不保存");
        return;
      }
      state.clips.unshift({
        id: makeId(),
        text: value,
        date: todayISO(),
        createdAt: new Date().toISOString()
      });
      saveClips();
      render();
      toast("已存入");
    }

    function todayClips() {
      return state.clips.filter(clip => clip.date === todayISO() && !isClipExpired(clip));
    }

    function deleteClip(id) {
      state.clips = state.clips.filter(clip => clip.id !== id);
      saveClips();
      render();
    }

    function clearTodayClips() {
      state.clips = state.clips.filter(clip => clip.date !== todayISO());
      saveClips();
      render();
      toast("已清空");
    }

    function clearExpiredClips(showToast = false) {
      const before = state.clips.length;
      state.clips = state.clips.filter(clip => !isClipExpired(clip));
      if (state.clips.length !== before) {
        saveClips();
        if (showToast) toast("剪贴板已清空");
      }
    }

    function scheduleClipClear() {
      clearTimeout(clipClearTimer);
      clipClearTimer = setTimeout(() => {
        clearExpiredClips(true);
        render();
        scheduleClipClear();
      }, msUntilNextClipClear());
    }

    function msUntilNextClipClear() {
      const now = new Date();
      const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 20, 0, 0, 0);
      if (now >= target) target.setDate(target.getDate() + 1);
      return Math.max(1000, target - now + 500);
    }

    function clipExpiry(iso) {
      const date = parseISO(iso);
      date.setHours(20, 0, 0, 0);
      return date;
    }

    function isClipExpired(clip) {
      return new Date() >= clipExpiry(clip.date);
    }

    async function toggleTopWindow() {
      if (pipWindow && !pipWindow.closed) {
        pipWindow.close();
        pipWindow = null;
        return;
      }
      if (!("documentPictureInPicture" in window)) {
        toast("当前浏览器不支持系统置顶");
        return;
      }
      try {
        pipWindow = await window.documentPictureInPicture.requestWindow({ width: 360, height: 520 });
        pipWindow.addEventListener("pagehide", () => {
          pipWindow = null;
        });
        pipWindow.document.title = "to-do-list";
        applyTheme(document.documentElement.dataset.theme);
        renderPipWindow();
      } catch {
        toast("置顶未开启");
      }
    }

    function renderPipWindow() {
      if (!pipWindow || pipWindow.closed) return;
      const doc = pipWindow.document;
      const tasks = state.tasks
        .filter(task => task.date === state.viewDate && task.status !== "canceled")
        .sort((a, b) => statusOrder(a.status) - statusOrder(b.status) || b.createdAt.localeCompare(a.createdAt));
      doc.body.innerHTML = `
        <style>
          * { box-sizing: border-box; }
          body { margin: 0; padding: 12px; color: var(--text); background: rgb(var(--paper)); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; }
          .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
          h1 { margin: 0; font-size: 18px; line-height: 1.2; }
          button { border: 0; cursor: pointer; font: inherit; }
          form { display: grid; grid-template-columns: 1fr 38px; gap: 8px; margin-bottom: 10px; }
          input { min-width: 0; height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255, 255, 255, .75); outline: 0; }
          .add, .round { display: grid; place-items: center; background: var(--accent); color: white; border-radius: 999px; }
          .add { width: 38px; height: 38px; font-size: 24px; }
          .round { width: 28px; height: 28px; background: rgba(118,118,128,.12); color: var(--muted); }
          .list { display: grid; gap: 8px; }
          .task { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: start; padding: 9px 8px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255, 255, 255, .75); }
          .title { margin: 4px 0 0; font-size: 14px; line-height: 1.35; word-break: break-word; }
          .done .title { color: var(--muted); text-decoration: line-through; }
          .check { width: 24px; height: 24px; border: 2px solid var(--line); background: transparent; border-radius: 999px; }
          .done .check { background: #34c759; border-color: #34c759; }
          .actions { display: flex; gap: 6px; }
        </style>
        <div class="head">
          <h1>${escapeHTML(state.viewDate === todayISO() ? "今天" : formatDate.format(parseISO(state.viewDate)))}</h1>
          <button class="round" id="close">×</button>
        </div>
        <form id="pipForm">
          <input id="pipInput" maxlength="120" placeholder="写下要做的事">
          <button class="add" type="submit">+</button>
        </form>
        <div class="list">
          ${tasks.map(task => `
            <article class="task ${escapeHTML(normalizeStatus(task.status))}" data-task-id="${escapeHTML(task.id)}">
              <button class="check" data-action="toggle" title="完成"></button>
              <p class="title">${escapeHTML(task.title)}</p>
              <div class="actions">
                <button class="round" data-action="delay" title="延期">↷</button>
                <button class="round" data-action="delete" title="删除">×</button>
              </div>
            </article>
          `).join("") || '<p class="title">这一天很清爽</p>'}
        </div>
      `;
      doc.querySelector("#close").addEventListener("click", () => pipWindow.close());
      doc.querySelector("#pipForm").addEventListener("submit", event => {
        event.preventDefault();
        const input = doc.querySelector("#pipInput");
        addTaskFromText(input.value, { repeatWeek: false, focusInput: input });
      });
      doc.querySelector(".list").addEventListener("click", event => {
        const item = event.target.closest("[data-task-id]");
        if (!item) return;
        const id = item.dataset.taskId;
        const action = event.target.closest("[data-action]")?.dataset.action;
        if (action === "toggle") toggleDone(id);
        if (action === "delay") postponeTask(id);
        if (action === "delete") deleteTask(id);
      });
    }

    function toggleDone(id) {
      const task = findTask(id);
      if (!task) return;
      task.status = task.status === "done" ? "todo" : "done";
      task.updatedAt = new Date().toISOString();
      saveTasks();
      render();
    }

    function postponeTask(id) {
      const task = findTask(id);
      if (!task) return;
      task.date = addDays(task.date, 1);
      task.status = "postponed";
      task.updatedAt = new Date().toISOString();
      saveTasks();
      render();
      toast("已延期一天");
    }

    function deleteTask(id) {
      state.tasks = state.tasks.filter(task => task.id !== id);
      saveTasks();
      render();
      toast("已删除");
    }

    function encodeNoteBase64(value) {
      return btoa(Array.from(new TextEncoder().encode(value), byte => String.fromCharCode(byte)).join(""));
    }

    function decodeNoteBase64(value) {
      const bytes = Uint8Array.from(atob(value), character => character.charCodeAt(0));
      return new TextDecoder("utf-8", { fatal: true, ignoreBOM: true }).decode(bytes);
    }

    function saveNativeNote(payload) {
      const fields = payload.split("|");
      if (fields.length !== 2) return;
      let task, note;
      try {
        task = findTask(decodeNoteBase64(fields[0]));
        note = decodeNoteBase64(fields[1]);
      } catch {
        return;
      }
      if (!task || (task.note || "") === note || note.length > 500) return;
      task.note = note;
      task.updatedAt = new Date().toISOString();
      saveTasks();
      render();
    }

    function setTaskDay(task, date) {
      if (task.date === date) return;
      task.date = date;
      task.updatedAt = new Date().toISOString();
      saveTasks();
    }

    function openSheet(id) {
      const task = findTask(id);
      if (!task) return;
      state.editingId = id;
      els.editTitle.value = task.title;
      els.editDate.value = task.date;
      els.editNote.value = task.note || "";
      els.sheetMask.dataset.mode = desktopHost ? "note" : "edit";
      els.editSheet.hidden = false;
      els.sheetMask.classList.add("open");
      els.sheetMask.setAttribute("aria-hidden", "false");
      const field = desktopHost ? els.editNote : els.editTitle;
      desktopHost?.postMessage("sheet:1");
      setTimeout(() => {
        if (state.editingId !== id) return;
        field.focus();
        requestDesktopFocus(field);
      }, 0);
    }

    function closeSheet() {
      if (!els.sheetMask.classList.contains("open")) return;
      if (desktopHost && els.sheetMask.dataset.mode === "note") saveDesktopSheet();
      scheduleNoteClose();
      state.editingId = null;
      els.sheetMask.classList.remove("open");
      delete els.sheetMask.dataset.mode;
      els.sheetMask.setAttribute("aria-hidden", "true");
      if (desktopHost) {
        if (els.sheetMask.contains(document.activeElement)) document.activeElement.blur();
        desktopHost.postMessage("sheet:0");
        render();
      }
    }

    function saveDesktopSheet() {
      if (!desktopHost || els.sheetMask.dataset.mode !== "note" || !els.sheetMask.classList.contains("open")) return;
      const task = findTask(state.editingId);
      if (!task) return;
      const note = els.editNote.value.trim();
      if ((task.note || "") === note) return;
      task.note = note;
      task.updatedAt = new Date().toISOString();
      saveTasks();
    }

    function saveEdit() {
      if (desktopHost) {
        closeSheet();
        return;
      }
      const task = findTask(state.editingId);
      if (!task) return;
      task.title = els.editTitle.value.trim();
      task.date = els.editDate.value;
      task.note = els.editNote.value.trim();
      task.updatedAt = new Date().toISOString();
      saveTasks();
      closeSheet();
      render();
      toast("已保存");
    }

    function loadTasks() {
      try {
        const raw = localStorage.getItem(storageKey);
        const tasks = raw ? JSON.parse(raw) : [];
        return Array.isArray(tasks) ? tasks : [];
      } catch {
        return [];
      }
    }

    function saveTasks() {
      localStorage.setItem(storageKey, JSON.stringify(state.tasks));
    }

    function loadClips() {
      try {
        const raw = localStorage.getItem(clipboardKey);
        const clips = raw ? JSON.parse(raw) : [];
        return Array.isArray(clips) ? clips.filter(clip => clip?.text && clip?.date) : [];
      } catch {
        return [];
      }
    }

    function saveClips() {
      localStorage.setItem(clipboardKey, JSON.stringify(state.clips));
    }

    function findTask(id) {
      return state.tasks.find(task => task.id === id);
    }

    function shiftViewDate(days) {
      state.viewDate = addDays(state.viewDate, days);
      render();
    }

    function todayISO() {
      return toISO(new Date());
    }

    function addDays(iso, days) {
      const date = parseISO(iso);
      date.setDate(date.getDate() + days);
      return toISO(date);
    }

    function weekDates(iso) {
      const date = parseISO(iso);
      const day = date.getDay();
      const mondayOffset = day === 0 ? -6 : 1 - day;
      const monday = addDays(iso, mondayOffset);
      return Array.from({ length: 7 }, (_, index) => addDays(monday, index));
    }

    function parseISO(iso) {
      const [year, month, day] = iso.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function toISO(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function startOfDay(date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }

    function shortDate(iso) {
      const date = parseISO(iso);
      const today = todayISO();
      if (iso === today) return "今天";
      if (iso === addDays(today, 1)) return "明天";
      return `${date.getMonth() + 1}/${date.getDate()}`;
    }

    function nextWeekday(dayText, nextWeek) {
      const map = { "日": 0, "天": 0, "一": 1, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6 };
      const target = map[dayText];
      const now = new Date();
      let diff = target - now.getDay();
      if (diff <= 0) diff += 7;
      if (nextWeek) diff += 7;
      return toISO(new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff));
    }

    function makeId() {
      if (crypto.randomUUID) return crypto.randomUUID();
      return `task-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      }[char]));
    }

    let toastTimer;
    function toast(message) {
      clearTimeout(toastTimer);
      els.toast.textContent = message;
      els.toast.classList.add("show");
      toastTimer = setTimeout(() => els.toast.classList.remove("show"), 1400);
    }
  </script>
  <script>
    if (!window.chrome?.webview && !window.desktopNote && "serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(error => {
          console.warn("离线功能注册失败：", error);
        });
      });
    }
  </script>
</body>
</html>
